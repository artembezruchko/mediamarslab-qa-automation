name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://qa-a.recruitment.mediamarslab.com' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://qa-a.recruitment.mediamarslab.com' }}
      X_ACCESS_KEY: ${{ secrets.X_ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:resilient

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  api-tests:
    # Runs after `test`, not concurrently with it: both jobs hit the same shared, rate-
    # limited QA backend, and running them on two separate runners at once compounds the
    # /api/auth/* budget exhaustion that `test:resilient` (above) is designed to recover
    # from — this just avoids adding to that pressure in the first place.
    needs: [test]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://qa-a.recruitment.mediamarslab.com' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://qa-a.recruitment.mediamarslab.com' }}
      X_ACCESS_KEY: ${{ secrets.X_ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only, needed by the request context)
        run: npx playwright install --with-deps chromium

      - name: Run API tests only
        run: npx playwright test --project=api
